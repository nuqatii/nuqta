# Deploys the server function (Google Wallet) and the Firestore security rules
# every time you upload changes to them on GitHub. One-time setup: GOOGLE_WALLET_SETUP.md, part 4.
name: Deploy to Firebase

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'assets/js/config.js'
      - 'assets/js/core/loyalty.js'
      - 'assets/js/ui/icons.js'
      - 'assets/js/core/receipt.js'
      - 'firebase.json'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch: {}

concurrency: firebase-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy key is set up
        id: key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is missing - skipping deploy. See GOOGLE_WALLET_SETUP.md part 4."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Share site code with the function
        if: steps.key.outputs.ok == 'true'
        run: |
          mkdir -p functions/shared
          cp assets/js/core/loyalty.js assets/js/core/receipt.js assets/js/config.js assets/js/ui/icons.js functions/shared/

      - name: Apple Wallet signing keys (only if set up)
        if: steps.key.outputs.ok == 'true'
        env:
          APPLE_CERT: ${{ secrets.APPLE_PASS_CERT }}
          APPLE_KEY: ${{ secrets.APPLE_PASS_KEY }}
        run: |
          if [ -n "$APPLE_CERT" ] && [ -n "$APPLE_KEY" ]; then
            printf 'APPLE_CERT_B64=%s\nAPPLE_KEY_B64=%s\n' "$(printf '%s' "$APPLE_CERT" | base64 -w0)" "$(printf '%s' "$APPLE_KEY" | base64 -w0)" > functions/.env
            echo "Apple Wallet keys added"
          else
            echo "Apple Wallet keys not set - skipping"
          fi

      - name: Email sending key (only if set up)
        if: steps.key.outputs.ok == 'true'
        env:
          RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_KEY" ]; then
            printf 'RESEND_API_KEY=%s\n' "$RESEND_KEY" >> functions/.env
            echo "Email key added"
          else
            echo "Email key not set - skipping"
          fi

      - name: Notification key (only if set up)
        if: steps.key.outputs.ok == 'true'
        env:
          VAPID_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ -n "$VAPID_KEY" ]; then
            printf 'VAPID_PRIVATE_KEY=%s\n' "$VAPID_KEY" >> functions/.env
            echo "Notification key added"
          else
            echo "Notification key not set - skipping"
          fi

      - name: Install function packages
        if: steps.key.outputs.ok == 'true'
        run: npm install --prefix functions --no-audit --no-fund

      - uses: google-github-actions/auth@v2
        if: steps.key.outputs.ok == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy functions and Firestore rules
        if: steps.key.outputs.ok == 'true'
        # The test site's repository sets the variables FIREBASE_PROJECT and FIREBASE_DEPLOY (TEST_SITE_SETUP.md).
        run: npx --yes firebase-tools@14 deploy --only "${{ vars.FIREBASE_DEPLOY || 'functions,firestore:rules' }}" --project "${{ vars.FIREBASE_PROJECT || 'nuqati-39894' }}" --non-interactive --force
